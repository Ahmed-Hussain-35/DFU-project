<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>DFU Clinical Platform</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
  :root{
    --bg:#0b0f14;--bg2:#0e141b;--panel:#12191f;--panel2:#161f27;
    --line:#212d38;--line2:#2b3a47;--ink:#e8eef4;--ink-dim:#8a99a8;--ink-faint:#5b6b7a;
    --teal:#38c2b6;--teal-dim:#1c5a55;
  }
  body.doctor-scope{
    --teal:#e0a458; --teal-dim:#6b4a1c;
    --bg:#181109; --bg2:#1d140a; --panel:#241a0c; --panel2:#2c2010;
    --line:#3d2c14; --line2:#4e3a1a;
    background:radial-gradient(1200px 600px at 78% -10%,#4a2a0a88,transparent 60%),
      linear-gradient(180deg,var(--bg),var(--bg2));
  }
  *{box-sizing:border-box}
  html,body{margin:0;min-height:100%}
  body{
    background:radial-gradient(1200px 600px at 78% -10%,#10202688,transparent 60%),
      linear-gradient(180deg,var(--bg),var(--bg2));
    color:var(--ink);font-family:"IBM Plex Sans",system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .mono{font-family:"IBM Plex Mono",monospace;font-variant-numeric:tabular-nums}
  #root{min-height:100vh;display:flex;flex-direction:column}

  .wrap{max-width:1200px;width:100%;margin:0 auto;padding:0 24px;flex:1;display:flex;flex-direction:column}
  header.top{
    display:flex;align-items:center;justify-content:space-between;
    padding:22px 0;border-bottom:1px solid var(--line);flex-shrink:0;
  }
  .brand{display:flex;align-items:baseline;gap:10px}
  .brand h1{font-size:19px;font-weight:700;margin:0;letter-spacing:-.01em}
  .brand .tag{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-faint)}
  .userbar{display:flex;align-items:center;gap:14px;font-size:13px;color:var(--ink-dim)}

  .card{background:var(--panel);border:1px solid var(--line);border-radius:14px}
  button.primary{
    padding:11px 18px;background:var(--teal);color:#06110f;border:none;
    border-radius:8px;font-weight:600;cursor:pointer;font-size:14px;font-family:inherit;
  }
  button.primary:disabled{opacity:.5;cursor:not-allowed}
  button.ghost{
    background:transparent;border:1px solid var(--line2);color:var(--ink-dim);
    padding:8px 16px;border-radius:8px;cursor:pointer;font-size:12.5px;font-family:inherit;
  }
  button.ghost:hover{color:var(--ink);border-color:#3a4e5e}
  input,select,textarea{
    width:100%;padding:11px 12px;margin-bottom:12px;background:var(--panel2);
    border:1px solid var(--line2);border-radius:8px;color:var(--ink);font-size:14px;
    font-family:inherit;display:block;
  }
  input:focus,select:focus,textarea:focus{outline:2px solid var(--teal);outline-offset:1px;border-color:transparent}
  .err{color:#f08c8c;background:#1c0f0f;border:1px solid #3a1a1a;padding:10px 12px;border-radius:9px;font-size:12.5px;margin-bottom:12px}
  .warn{background:#1e1608;border:1px solid #3a2c10;color:#f0b866;padding:9px 12px;border-radius:9px;font-size:12.5px;margin-top:10px}
  .disclaimer{font-size:11px;color:var(--ink-faint);text-align:center;padding:18px 0;line-height:1.5;flex-shrink:0}

  .auth-center{flex:1;display:flex;align-items:center;justify-content:center}
  .authcard{width:100%;max-width:380px;padding:32px}
  .authcard h2{margin:0 0 20px;font-size:20px}
  .switch{text-align:center;margin-top:16px;font-size:12.5px;color:var(--ink-dim)}
  .switch a{color:var(--teal);cursor:pointer}

  .main-grid{display:grid;grid-template-columns:1.3fr 1fr;gap:20px;padding:24px 0 8px;align-items:start}
  @media(max-width:900px){.main-grid{grid-template-columns:1fr}}

  .viewer{padding:0;overflow:hidden}
  .viewer .tabs{display:flex;gap:2px;padding:8px;border-bottom:1px solid var(--line);background:var(--panel2);flex-wrap:wrap}
  .tab{
    appearance:none;border:1px solid transparent;background:transparent;color:var(--ink-dim);
    font-family:inherit;font-size:12.5px;font-weight:500;padding:7px 13px;border-radius:8px;cursor:pointer;
  }
  .tab[aria-selected="true"]{background:var(--bg);color:var(--teal);border-color:var(--line2)}
  .tab:disabled{opacity:.35;cursor:not-allowed}
  .canvas{
    min-height:340px;display:flex;align-items:center;justify-content:center;padding:20px;
    background:linear-gradient(#141c24 1px,transparent 1px) 0 0/26px 26px,
      linear-gradient(90deg,#141c24 1px,transparent 1px) 0 0/26px 26px, var(--bg);
  }
  .canvas img{max-width:100%;max-height:420px;border-radius:6px;display:block}
  .drop{
    text-align:center;padding:44px 24px;border:1.5px dashed var(--line2);border-radius:12px;
    cursor:pointer;width:100%;max-width:380px;transition:border-color .15s,background .15s;
  }
  .drop:hover{border-color:var(--teal);background:#0f1c22}
  .drop h3{margin:0 0 6px;font-size:15px;font-weight:600}
  .drop p{margin:0;font-size:12.5px;color:var(--ink-dim)}

  .readout{display:flex;flex-direction:column}
  .rd-section{padding:18px;border-bottom:1px solid var(--line)}
  .rd-section:last-child{border-bottom:none}
  .eyebrow{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-faint);margin-bottom:10px}
  .sev-row{display:flex;align-items:center;gap:10px}
  .sev-chip{width:11px;height:11px;border-radius:3px;flex-shrink:0}
  .sev-label{font-size:17px;font-weight:700}

  .stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .stat{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
  .stat .k{font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-faint)}
  .stat .v{font-size:23px;font-weight:600;margin-top:5px;line-height:1}
  .stat .v .u{font-size:12px;color:var(--ink-dim);font-weight:400}

  .featrow{margin-bottom:10px}
  .featrow:last-child{margin-bottom:0}
  .featrow-top{display:flex;justify-content:space-between;font-size:12px;margin-bottom:4px}
  .featrow-top .name{color:var(--ink-dim)}
  .track{height:6px;background:#0c1418;border-radius:4px;overflow:hidden}
  .fill{height:100%;border-radius:4px}

  .placeholder{padding:60px 24px;text-align:center;color:var(--ink-faint);font-size:13px}

  .hist-item{
    display:grid;grid-template-columns:auto 1fr auto auto auto;gap:12px;align-items:center;
    padding:11px 14px;background:var(--panel2);border-radius:8px;margin-bottom:8px;font-size:12.5px;
  }
  .hist-item .status{
    font-size:10.5px;padding:3px 8px;border-radius:20px;background:var(--bg);
    color:var(--ink-dim);text-transform:uppercase;letter-spacing:.04em;
  }

  .doc-shell{max-width:520px;margin:32px auto;padding:26px}
  .doc-shell h3{margin:0 0 4px}
  label.check{display:flex;align-items:center;gap:9px;font-size:13.5px;margin:14px 0}
  label.check input{width:16px;height:16px;flex-shrink:0;margin:0;accent-color:var(--teal)}
  /* animations */
  @keyframes spin{to{transform:rotate(360deg)}}
  @keyframes fadeIn{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:translateY(0)}}
  @keyframes popIn{from{opacity:0;transform:scale(.94)}to{opacity:1;transform:scale(1)}}
  @keyframes revealIn{0%{opacity:0;transform:translateY(-10px) scale(.97)}100%{opacity:1;transform:translateY(0) scale(1)}}
  .reveal-in{animation:revealIn .32s cubic-bezier(.22,.85,.3,1)}
  button{transition:transform .1s ease, opacity .1s ease}
  button:active{transform:scale(.96)}
  button:disabled{opacity:.6;cursor:not-allowed}
  .spin{display:inline-block;animation:spin .7s linear infinite}
  .fade-in{animation:fadeIn .28s ease}
  .pop-in{animation:popIn .2s ease}
  .card{animation:fadeIn .25s ease}
  .hist-item{transition:background .15s ease}
  .hist-item:hover{background:var(--line)}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const {useState,useEffect,useCallback} = React;
const API = "";

const FEATURE_MAX = {Redness:60,Necrosis:60,Pus:40,Swelling:60,Irregularity:100,Size:100};
const FEATURE_TINT = {Redness:"#e05c5c",Necrosis:"#b0473b",Pus:"#e0b64a",Swelling:"#d98a4a",Irregularity:"#7aa0c0",Size:"#38c2b6"};

function useAuth(){
  // sessionStorage (not localStorage) -> each browser TAB keeps its own session,
  // so patient in one tab + doctor in another never overwrite each other.
  const [token,setToken] = useState(sessionStorage.getItem("dfu_token"));
  const [role,setRole] = useState(sessionStorage.getItem("dfu_role"));
  const [name,setName] = useState(sessionStorage.getItem("dfu_name"));
  const [isVerified,setIsVerified] = useState(sessionStorage.getItem("dfu_verified")==="true");
  const login = (t,r,n,v) => {
    sessionStorage.setItem("dfu_token",t); sessionStorage.setItem("dfu_role",r); sessionStorage.setItem("dfu_name",n||"");
    sessionStorage.setItem("dfu_verified", v?"true":"false");
    setToken(t); setRole(r); setName(n); setIsVerified(!!v);
  };
  const logout = () => {
    sessionStorage.removeItem("dfu_token"); sessionStorage.removeItem("dfu_role");
    sessionStorage.removeItem("dfu_name"); sessionStorage.removeItem("dfu_verified");
    setToken(null); setRole(null); setName(null); setIsVerified(false);
  };
  return {token,role,name,isVerified,login,logout};
}

function AuthForm({onAuth}){
  const [mode,setMode] = useState("login");
  const [form,setForm] = useState({email:"",password:"",full_name:"",role:"patient",doctor_id:"",license_number:"",medical_council:""});
  const [licenseFile,setLicenseFile] = useState(null);
  const [error,setError] = useState(null);
  const [busy,setBusy] = useState(false);
  const [doctors,setDoctors] = useState([]);

  useEffect(()=>{
    if(mode==="register" && form.role==="patient"){
      fetch(API+"/auth/doctors").then(r=>r.json()).then(setDoctors).catch(()=>setDoctors([]));
    }
  },[mode,form.role]);

  const submit = async(e)=>{
    e.preventDefault(); setError(null); setBusy(true);
    try{
      let res;
      if(mode==="register"){
        const body = {...form, doctor_id: form.role==="patient" ? Number(form.doctor_id) : null};
        res = await fetch(API+"/auth/register",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)});
      } else {
        const body = new URLSearchParams({username:form.email,password:form.password});
        res = await fetch(API+"/auth/login",{method:"POST",headers:{"Content-Type":"application/x-www-form-urlencoded"},body});
      }
      const data = await res.json();
      if(!res.ok) throw new Error(data.detail || "Failed");

      // doctor registration + a license file selected -> upload it right away,
      // using the fresh token, before switching into the app
      if(mode==="register" && form.role==="doctor" && licenseFile){
        const fd = new FormData(); fd.append("file",licenseFile);
        await fetch(API+"/auth/doctor/upload-license",{method:"POST",
          headers:{Authorization:"Bearer "+data.access_token}, body:fd}).catch(()=>{});
      }

      onAuth(data.access_token, data.role, data.full_name, data.is_verified);
    }catch(err){ setError(err.message); }
    finally{ setBusy(false); }
  };

  return (
    <div className="auth-center">
      <div className="card authcard">
        <h2>{mode==="login"?"Log in":"Create account"}</h2>
        {error && <div className="err">{error}</div>}
        <form onSubmit={submit}>
          {mode==="register" &&
            <input placeholder="Full name" value={form.full_name}
              onChange={e=>setForm({...form,full_name:e.target.value})} required/>}
          <input type="email" placeholder="Email" value={form.email}
            onChange={e=>setForm({...form,email:e.target.value})} required/>
          <input type="password" placeholder="Password" value={form.password}
            onChange={e=>setForm({...form,password:e.target.value})} required/>
          {mode==="register" &&
            <select value={form.role} onChange={e=>setForm({...form,role:e.target.value,doctor_id:""})}>
              <option value="patient">Patient</option>
              <option value="doctor">Doctor</option>
            </select>}
          {mode==="register" && form.role==="patient" &&
            <select value={form.doctor_id} onChange={e=>setForm({...form,doctor_id:e.target.value})} required>
              <option value="" disabled>Choose your doctor…</option>
              {doctors.map(d=>
                <option key={d.doctor_id} value={d.doctor_id}>Dr. {d.full_name} — {d.specialty}</option>)}
              {doctors.length===0 && <option value="" disabled>No verified doctors yet</option>}
            </select>}
          {mode==="register" && form.role==="doctor" &&
            <input placeholder="Medical license number" value={form.license_number}
              onChange={e=>setForm({...form,license_number:e.target.value})}/>}
          {mode==="register" && form.role==="doctor" &&
            <input placeholder="State Medical Council (e.g. Telangana State Medical Council)"
              value={form.medical_council}
              onChange={e=>setForm({...form,medical_council:e.target.value})}/>}
          {mode==="register" && form.role==="doctor" &&
            <div style={{marginBottom:12}}>
              <label style={{fontSize:12,color:"var(--ink-dim)",display:"block",marginBottom:6}}>
                License certificate (image or PDF, optional but recommended)</label>
              <input type="file" accept="image/*,.pdf"
                onChange={e=>setLicenseFile(e.target.files[0]||null)}/>
            </div>}
          {mode==="register" && form.role==="doctor" &&
            <p style={{fontSize:11.5,color:"var(--ink-faint)",marginTop:-6,marginBottom:12}}>
              Your account needs admin approval before patients can select you. None of this is
              checked against a real medical registry automatically — an admin reviews it manually.</p>}
          <button className="primary" style={{width:"100%"}} disabled={busy}>
            {busy?"...":mode==="login"?"Log in":"Register"}
          </button>
        </form>
        <div className="switch">
          {mode==="login"
            ? <>No account? <a onClick={()=>setMode("register")}>Register</a></>
            : <>Have an account? <a onClick={()=>setMode("login")}>Log in</a></>}
        </div>
      </div>
    </div>
  );
}

function Bar({name,value,max,tint}){
  const pct = Math.min(100,(value/max)*100);
  return (
    <div className="featrow">
      <div className="featrow-top"><span className="name">{name}</span><span className="mono">{value.toFixed(1)}%</span></div>
      <div className="track"><div className="fill" style={{width:pct+"%",background:tint}}/></div>
    </div>
  );
}

function Readout({result,extra,showVisitId=true}){
  if(!result) return <div className="card readout"><div className="placeholder">Upload a photo to see the analysis here.</div></div>;
  const {infection,coverage_pct,features,severity_label,visit_id} = result;
  return (
    <div className="card readout">
      {visit_id && showVisitId && (
        <div className="rd-section" style={{background:"var(--panel2)"}}>
          <div className="eyebrow">Visit ID — share this with your doctor</div>
          <div style={{display:"flex",alignItems:"center",gap:10}}>
            <span className="mono" style={{fontSize:20,fontWeight:700,color:"var(--teal)"}}>#{visit_id}</span>
            <button className="ghost" onClick={()=>navigator.clipboard.writeText(String(visit_id))}>Copy</button>
          </div>
        </div>
      )}
      <div className="rd-section">
        <div className="eyebrow">AI Visual Indicator (not a diagnosis)</div>
        <div className="sev-row">
          <span className="sev-chip" style={{background:infection.color}}/>
          <span className="sev-label" style={{color:infection.color}}>{infection.level}</span>
        </div>
      </div>
      <div className="rd-section">
        <div className="stat-grid">
          <div className="stat"><div className="k">Coverage</div>
            <div className="v mono">{coverage_pct.toFixed(2)}<span className="u"> %</span></div></div>
          <div className="stat"><div className="k">Infection score</div>
            <div className="v mono" style={{color:infection.color}}>{infection.score.toFixed(0)}<span className="u"> /100</span></div></div>
        </div>
        <div style={{marginTop:12}} className="track"><div className="fill" style={{width:infection.score+"%",background:infection.color}}/></div>
        {infection.override && <div className="warn">⚠ {infection.override}</div>}
      </div>
      {features && (
        <div className="rd-section">
          <div className="eyebrow">Wound features</div>
          {Object.entries(features).map(([k,v])=>
            <Bar key={k} name={k} value={v} max={FEATURE_MAX[k]||100} tint={FEATURE_TINT[k]||"#38c2b6"}/>
          )}
        </div>
      )}
      <div className="rd-section" style={{fontSize:11,color:"var(--ink-faint)"}}>
        Size-based severity: <b className="mono" style={{color:"var(--ink)"}}>{severity_label}</b>
      </div>
      {extra && <div className="rd-section">{extra}</div>}
    </div>
  );
}

function ChatPanel({fetchUrl,token,myUserLabel,otherUserId}){
  const [messages,setMessages] = useState([]);
  const [text,setText] = useState("");
  const [error,setError] = useState(null);
  const [connected,setConnected] = useState(false);
  const boxRef = React.useRef(null);
  const wsRef = React.useRef(null);

  useEffect(()=>{
    fetch(API+fetchUrl,{headers:{Authorization:"Bearer "+token}})
      .then(r=>r.ok?r.json():[]).then(setMessages).catch(()=>{});
  },[fetchUrl,token]);

  useEffect(()=>{
    if(!otherUserId) return;
    const proto = location.protocol==="https:" ? "wss:" : "ws:";
    const ws = new WebSocket(`${proto}//${location.host}/ws/chat?token=${encodeURIComponent(token)}`);
    wsRef.current = ws;
    ws.onopen = ()=>setConnected(true);
    ws.onclose = ()=>setConnected(false);
    ws.onerror = ()=>setError("Chat connection lost — try refreshing.");
    ws.onmessage = (e)=>{
      const data = JSON.parse(e.data);
      setMessages(prev=>[...prev,data]);
    };
    return ()=>ws.close();
  },[otherUserId,token]);

  useEffect(()=>{
    if(boxRef.current) boxRef.current.scrollTop = boxRef.current.scrollHeight;
  },[messages]);

  const send = ()=>{
    if(!text.trim()) return;
    if(!wsRef.current || wsRef.current.readyState!==1){ setError("Not connected yet — wait a moment."); return; }
    wsRef.current.send(JSON.stringify({to_user_id:otherUserId, content:text}));
    setText("");
  };

  return (
    <div className="card" style={{padding:0,display:"flex",flexDirection:"column",height:340}}>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"14px 18px 0"}}>
        <div className="eyebrow" style={{marginBottom:0}}>Messages</div>
        <span className="mono" style={{fontSize:10,color:connected?"var(--teal)":"var(--ink-faint)"}}>
          {connected?"● live":"○ connecting…"}</span>
      </div>
      <div ref={boxRef} style={{flex:1,overflowY:"auto",padding:"10px 18px",display:"flex",flexDirection:"column",gap:8}}>
        {messages.length===0 && <p style={{color:"var(--ink-faint)",fontSize:12.5}}>No messages yet.</p>}
        {messages.map(m=>(
          <div key={m.id} className="pop-in" style={{alignSelf:m.sender_name===myUserLabel?"flex-end":"flex-start",maxWidth:"78%"}}>
            <div style={{fontSize:10.5,color:"var(--ink-faint)",marginBottom:2}}>{m.sender_name}</div>
            <div style={{background:m.sender_name===myUserLabel?"var(--teal-dim)":"var(--panel2)",
              border:"1px solid var(--line)",borderRadius:10,padding:"7px 11px",fontSize:13}}>{m.content}</div>
          </div>
        ))}
      </div>
      <div style={{display:"flex",gap:8,padding:14,borderTop:"1px solid var(--line)"}}>
        <input placeholder="Type a message…" value={text}
          onChange={e=>setText(e.target.value)}
          onKeyDown={e=>e.key==="Enter" && send()}
          style={{marginBottom:0}}/>
        <button className="primary" onClick={send}>Send</button>
      </div>
      {error && <div style={{padding:"0 14px 10px"}}><div className="err">{error}</div></div>}
    </div>
  );
}

function PatientView({token,name,logout}){
  const [preview,setPreview] = useState(null);
  const [pendingFile,setPendingFile] = useState(null);
  const [patientNote,setPatientNote] = useState("");
  const [result,setResult] = useState(null);
  const [history,setHistory] = useState([]);
  const [loading,setLoading] = useState(false);
  const [error,setError] = useState(null);
  const [view,setView] = useState("overlay");
  const [historyLoading,setHistoryLoading] = useState(false);

  const loadHistory = useCallback(async()=>{
    setHistoryLoading(true);
    try{
      const res = await fetch(API+"/visits/history",{headers:{Authorization:"Bearer "+token}});
      if(res.ok) setHistory(await res.json());
    } finally { setHistoryLoading(false); }
  },[token]);
  useEffect(()=>{ loadHistory(); },[loadHistory]);

  const pickFile = (file)=>{
    setResult(null); setError(null); setPendingFile(file);
    setPreview(URL.createObjectURL(file));
  };

  const submitUpload = async()=>{
    if(!pendingFile) return;
    setError(null); setLoading(true); setView("overlay");
    try{
      const fd = new FormData(); fd.append("file",pendingFile); fd.append("notes",patientNote);
      const res = await fetch(API+"/visits/upload",{method:"POST",headers:{Authorization:"Bearer "+token},body:fd});
      const data = await res.json();
      if(!res.ok) throw new Error(data.detail || "Upload failed");
      setResult(data); setPendingFile(null); setPatientNote("");
      loadHistory();
    }catch(e){ setError(e.message); }
    finally{ setLoading(false); }
  };

  const [doctorInfo,setDoctorInfo] = useState(null);
  const [doctorList,setDoctorList] = useState([]);
  const [changingDoctor,setChangingDoctor] = useState(false);
  const [newDoctorId,setNewDoctorId] = useState("");
  const [doctorMsg,setDoctorMsg] = useState(null);

  const loadDoctorInfo = useCallback(async()=>{
    const res = await fetch(API+"/messages/patient/contact",{headers:{Authorization:"Bearer "+token}});
    if(res.ok) setDoctorInfo(await res.json());
  },[token]);
  useEffect(()=>{ loadDoctorInfo(); },[loadDoctorInfo]);

  const startChangeDoctor = ()=>{
    setChangingDoctor(true); setDoctorMsg(null);
    fetch(API+"/auth/doctors").then(r=>r.json()).then(setDoctorList).catch(()=>setDoctorList([]));
  };

  const saveDoctorChange = async()=>{
    if(!newDoctorId) return;
    const res = await fetch(API+"/auth/patient/change-doctor",{method:"POST",
      headers:{"Content-Type":"application/json",Authorization:"Bearer "+token},
      body:JSON.stringify({doctor_id:Number(newDoctorId)})});
    const data = await res.json();
    if(!res.ok){ setDoctorMsg(data.detail||"Failed"); return; }
    setDoctorMsg("Doctor updated."); setChangingDoctor(false);
    loadDoctorInfo();
  };

  const doctorUserId = doctorInfo ? doctorInfo.user_id : null;

  const [pastVisit,setPastVisit] = useState(null);
  const [pastView,setPastView] = useState("overlay");
  const [pastError,setPastError] = useState(null);
  const openPast = async(id)=>{
    setPastError(null); setPastVisit(null); setPastView("overlay");
    const res = await fetch(API+`/visits/${id}`,{headers:{Authorization:"Bearer "+token}});
    const data = await res.json();
    if(!res.ok){ setPastError(data.detail||"Could not load that visit"); return; }
    setPastVisit(data);
  };

  const tabs = [["overlay","Overlay"],["boundary","Boundary"],["mask","Mask"],["original","Original"]];
  const shown = view==="original" ? preview : (result && result.images ? result.images[view] : preview);

  return (
    <div className="wrap">
      <header className="top">
        <div className="brand"><h1>DFU Clinical Platform</h1><span className="tag">Patient</span></div>
        <div className="userbar">{name || "Patient"}<button className="ghost" onClick={logout}>Log out</button></div>
      </header>

      <div className="main-grid">
        <div className="card viewer">
          <div className="tabs">
            {tabs.map(([id,label])=>
              <button key={id} className="tab" aria-selected={view===id}
                disabled={!preview || (id!=="original" && !result)}
                onClick={()=>setView(id)}>{label}</button>)}
          </div>
          <div className="canvas">
            {!preview && (
              <div className="drop" onClick={()=>document.getElementById("fileInp").click()}>
                <h3>Upload a wound photo</h3>
                <p>Click to browse · JPG or PNG</p>
                <input id="fileInp" type="file" accept="image/*" hidden
                  onChange={e=>e.target.files[0] && pickFile(e.target.files[0])}/>
              </div>
            )}
            {preview && <img src={shown} alt={view}/>}
          </div>
          {preview && (
            <div style={{padding:"14px 18px",borderTop:"1px solid var(--line)"}}>
              {!result && !loading && (
                <div style={{marginBottom:12}}>
                  <div className="eyebrow">Tell your doctor anything relevant (optional)</div>
                  <textarea placeholder="e.g. it hurts near the edge, started 3 days ago… (Enter to analyze, Shift+Enter for a new line)"
                    value={patientNote} onChange={e=>setPatientNote(e.target.value)}
                    onKeyDown={e=>{ if(e.key==="Enter" && !e.shiftKey){ e.preventDefault(); submitUpload(); } }}
                    style={{minHeight:60,marginBottom:10}}/>
                  <button className="primary" onClick={submitUpload}>Analyze photo</button>
                </div>
              )}
              <button className="ghost" onClick={()=>{setPreview(null);setResult(null);setPendingFile(null);setPatientNote("");}}>New image</button>
              {loading && <span className="mono" style={{marginLeft:12,color:"var(--teal)",fontSize:12}}>ANALYZING…</span>}
            </div>
          )}
          {error && <div style={{padding:"0 18px 16px"}}><div className="err">{error}</div></div>}
          {result && !result.image_quality?.ok && (
            <div style={{padding:"0 18px 16px"}}>
              {result.image_quality.warnings.map((w,i)=><div key={i} className="warn">⚠ {w}</div>)}
            </div>
          )}
        </div>

        <Readout result={result}/>
      </div>

      <div style={{marginBottom:20}}>
        <ChatPanel fetchUrl="/messages/patient/thread"
          token={token} myUserLabel={name} otherUserId={doctorUserId}/>
      </div>

      {pastError && <div style={{marginBottom:16}}><div className="err">{pastError}</div></div>}

      {pastVisit && (
        <div className="main-grid reveal-in" style={{marginBottom:20,paddingTop:0}}>
          <div className="card viewer">
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",
              padding:"12px 18px",borderBottom:"1px solid var(--line)"}}>
              <span className="eyebrow" style={{marginBottom:0}}>Visit #{pastVisit.visit_id} — {new Date(pastVisit.created_at).toLocaleDateString()}</span>
              <button className="ghost" onClick={()=>setPastVisit(null)}>Close</button>
            </div>
            <div className="tabs">
              {[["overlay","Overlay"],["boundary","Boundary"],["mask","Mask"]].map(([id,label])=>
                <button key={id} className="tab" aria-selected={pastView===id}
                  onClick={()=>setPastView(id)}>{label}</button>)}
            </div>
            <div className="canvas">
              {pastVisit.images && <img src={pastVisit.images[pastView]} alt={pastView}/>}
            </div>
            {pastVisit.doctor_notes && (
              <div style={{padding:"14px 18px",borderTop:"1px solid var(--line)",background:"var(--panel2)"}}>
                <div className="eyebrow" style={{marginBottom:6}}>Doctor's note</div>
                <div style={{fontSize:13.5}}>{pastVisit.doctor_notes}</div>
              </div>
            )}
          </div>
          <Readout result={pastVisit} showVisitId={false}/>
        </div>
      )}

      <div className="card" style={{margin:"4px 0 20px",padding:18}}>
        <div className="eyebrow">Your doctor</div>
        {!changingDoctor ? (
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}>
            <span>{doctorInfo ? `Dr. ${doctorInfo.full_name}` : "Loading…"}</span>
            <button className="ghost" onClick={startChangeDoctor}>Change</button>
          </div>
        ) : (
          <div>
            <select value={newDoctorId} onChange={e=>setNewDoctorId(e.target.value)}>
              <option value="" disabled>Choose a new doctor…</option>
              {doctorList.map(d=>
                <option key={d.doctor_id} value={d.doctor_id}>Dr. {d.full_name} — {d.specialty}</option>)}
            </select>
            <div style={{display:"flex",gap:10}}>
              <button className="primary" onClick={saveDoctorChange}>Save</button>
              <button className="ghost" onClick={()=>setChangingDoctor(false)}>Cancel</button>
            </div>
          </div>
        )}
        {doctorMsg && <p style={{fontSize:12.5,color:"var(--teal)",marginTop:8}}>{doctorMsg}</p>}
      </div>

      <div className="card" style={{margin:"4px 0 24px",padding:18}}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:10}}>
          <div className="eyebrow" style={{marginBottom:0}}>Visit history</div>
          <button className="ghost" onClick={loadHistory} disabled={historyLoading}>
            {historyLoading ? <span className="spin">↻</span> : "Refresh"}
          </button>
        </div>
        {history.length===0 && <p style={{color:"var(--ink-faint)",fontSize:13,margin:0}}>No visits yet.</p>}
        {history.map(v=>(
          <div key={v.visit_id}>
            <div className="hist-item" style={{cursor:"pointer"}} onClick={()=>openPast(v.visit_id)}>
              <span className="mono">#{v.visit_id}</span>
              <span className="mono">{new Date(v.created_at).toLocaleDateString()}</span>
              <span className="mono">{v.coverage_pct?.toFixed(2)}%</span>
              <span className="mono">{v.severity_label}</span>
              <span className="status">{v.review_status}</span>
            </div>
            {v.doctor_notes && (
              <div style={{background:"var(--panel2)",border:"1px solid var(--line)",borderRadius:8,
                padding:"10px 14px",marginTop:-4,marginBottom:8,fontSize:12.5,color:"var(--ink-dim)"}}>
                <span style={{color:"var(--teal)",fontWeight:600}}>Doctor's note: </span>
                {v.doctor_notes}
                {v.mask_confirmed===false &&
                  <div style={{color:"#f0b866",marginTop:4}}>⚠ Doctor flagged the AI mask as incorrect.</div>}
              </div>
            )}
          </div>
        ))}
      </div>

      <p className="disclaimer">For educational and research use only. Not a medical diagnosis.</p>
    </div>
  );
}

function DoctorView({token,name,isVerified,logout}){
  useEffect(()=>{
    document.body.classList.add("doctor-scope");
    return ()=> document.body.classList.remove("doctor-scope");
  },[]);
  const [visitId,setVisitId] = useState("");
  const [visit,setVisit] = useState(null);
  const [notes,setNotes] = useState("");
  const [confirmed,setConfirmed] = useState(true);
  const [error,setError] = useState(null);
  const [msg,setMsg] = useState(null);
  const [view,setView] = useState("overlay");
  const [patients,setPatients] = useState([]);
  const [patientsLoading,setPatientsLoading] = useState(false);

  const [liveVerified,setLiveVerified] = useState(isVerified);
  useEffect(()=>{
    fetch(API+"/auth/doctor/status",{headers:{Authorization:"Bearer "+token}})
      .then(r=>r.ok?r.json():null).then(d=>d && setLiveVerified(d.is_verified)).catch(()=>{});
  },[token]);

  const loadPatients = useCallback(async()=>{
    setPatientsLoading(true);
    try{
      const res = await fetch(API+"/visits/doctor/my-patients",{headers:{Authorization:"Bearer "+token}});
      if(res.ok) setPatients(await res.json());
    } finally { setPatientsLoading(false); }
  },[token]);
  useEffect(()=>{ loadPatients(); },[loadPatients]);

  const load = async(id)=>{
    const useId = id || visitId;
    setError(null); setMsg(null); setVisit(null); setVisitId(useId);
    const res = await fetch(API+`/visits/${useId}`,{headers:{Authorization:"Bearer "+token}});
    const data = await res.json();
    if(!res.ok){ setError(data.detail||"Not found"); return; }
    setVisit(data); setNotes(data.doctor_notes||""); setView("overlay");
  };

  const [reviewSaving,setReviewSaving] = useState(false);
  const submitReview = async()=>{
    setReviewSaving(true);
    try{
      const res = await fetch(API+`/visits/${visitId}/review`,{method:"POST",
        headers:{"Content-Type":"application/json",Authorization:"Bearer "+token},
        body:JSON.stringify({doctor_notes:notes,mask_confirmed:confirmed,review_status:"reviewed"})});
      const data = await res.json();
      if(!res.ok){ setError(data.detail||"Failed"); return; }
      setVisit(data); setMsg("Review saved.");
      loadPatients();
    } finally { setReviewSaving(false); }
  };

  const tabs = [["overlay","Overlay"],["boundary","Boundary"],["mask","Mask"]];

  const reviewForm = (
    <div>
      <div className="eyebrow">Clinician review</div>
      <textarea placeholder="Doctor notes (Enter to save, Shift+Enter for a new line)"
        value={notes} onChange={e=>setNotes(e.target.value)}
        onKeyDown={e=>{ if(e.key==="Enter" && !e.shiftKey){ e.preventDefault(); submitReview(); } }}
        style={{minHeight:80}}/>
      <label className="check">
        <input type="checkbox" checked={confirmed} onChange={e=>setConfirmed(e.target.checked)}/>
        AI mask looks correct
      </label>
      <button className="primary" style={{width:"100%"}} onClick={submitReview} disabled={reviewSaving}>
        {reviewSaving ? <span className="spin">↻</span> : "Save review"}
      </button>
      {msg && <p className="fade-in" style={{color:"var(--teal)",fontSize:13,marginTop:10}}>{msg}</p>}
      {visit && visit.patient_id && (
        <div style={{marginTop:16}}>
          <ChatPanel fetchUrl={`/messages/doctor/thread/${visit.patient_id}`}
            token={token} myUserLabel={name} otherUserId={visit.patient_user_id}/>
        </div>
      )}
    </div>
  );

  return (
    <div className="wrap">
      <header className="top">
        <div className="brand"><h1>DFU Clinical Platform</h1><span className="tag">Doctor</span></div>
        <div className="userbar">{name || "Doctor"}<button className="ghost" onClick={logout}>Log out</button></div>
      </header>

      {!liveVerified && (
        <div className="warn" style={{margin:"18px 0"}}>
          ⚠ Your account is pending admin approval. Patients cannot select you as their
          doctor yet, but you can still use everything else here in the meantime.
        </div>
      )}

      <div className="card" style={{margin:"24px 0 16px",padding:18}}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:10}}>
          <div className="eyebrow" style={{marginBottom:0}}>My patients</div>
          <button className="ghost" onClick={loadPatients} disabled={patientsLoading}>
            {patientsLoading ? <span className="spin">↻</span> : "Refresh"}
          </button>
        </div>
        {patients.length===0 && <p style={{color:"var(--ink-faint)",fontSize:13,margin:0}}>
          No visits from your patients yet.</p>}
        {patients.map(v=>(
          <div key={v.visit_id} className="hist-item" style={{cursor:"pointer"}} onClick={()=>load(v.visit_id)}>
            <span className="mono">#{v.visit_id}</span>
            <span>{v.patient_name}</span>
            <span className="mono">{v.coverage_pct?.toFixed(2)}%</span>
            <span className="mono">{v.severity_label}</span>
            <span className="status">{v.review_status}</span>
          </div>
        ))}
      </div>

      <div className="card" style={{margin:"0 0 16px",padding:18}}>
        <div className="eyebrow">Or look up any visit by ID</div>
        <div style={{display:"flex",gap:10}}>
          <input placeholder="Visit ID (e.g. 384712)" value={visitId}
            onChange={e=>setVisitId(e.target.value)} style={{marginBottom:0}}/>
          <button className="primary" onClick={()=>load()}>Load</button>
        </div>
        {error && <div className="err" style={{marginTop:12}}>{error}</div>}
      </div>

      {visit && (
        <div className="main-grid">
          <div className="card viewer">
            {visit.patient_notes && (
              <div style={{padding:"14px 18px",borderBottom:"1px solid var(--line)",background:"var(--panel2)"}}>
                <div className="eyebrow" style={{marginBottom:6}}>Patient reported</div>
                <div style={{fontSize:13.5,color:"var(--ink)"}}>{visit.patient_notes}</div>
              </div>
            )}
            <div className="tabs">
              {tabs.map(([id,label])=>
                <button key={id} className="tab" aria-selected={view===id}
                  onClick={()=>setView(id)}>{label}</button>)}
            </div>
            <div className="canvas">
              {visit.images && <img src={visit.images[view]} alt={view}/>}
            </div>
            {!visit.image_quality?.ok && (
              <div style={{padding:"0 18px 16px"}}>
                {visit.image_quality.warnings.map((w,i)=><div key={i} className="warn">⚠ {w}</div>)}
              </div>
            )}
          </div>
          <Readout result={visit} extra={reviewForm} showVisitId={false}/>
        </div>
      )}
    </div>
  );
}

function AdminPanel(){
  const [key,setKey] = useState("");
  const [showKey,setShowKey] = useState(false);
  const [unlocked,setUnlocked] = useState(false);
  const [pending,setPending] = useState([]);
  const [error,setError] = useState(null);
  const [msg,setMsg] = useState(null);
  const [unlocking,setUnlocking] = useState(false);
  const [approvingId,setApprovingId] = useState(null);

  const viewDocument = async(doctorId)=>{
    const res = await fetch(API+`/admin/doctor-license/${doctorId}`,{headers:{"X-Admin-Key":key}});
    if(!res.ok){ setMsg("No document uploaded for this doctor."); return; }
    const blob = await res.blob();
    window.open(URL.createObjectURL(blob), "_blank");
  };

  const openRegistry = ()=>{
    // The real, official NMC Indian Medical Register — search manually by
    // name / registration number / State Medical Council. Not auto-filled;
    // this is an honest "go check yourself" link, not automated verification.
    window.open("https://www.nmc.org.in/information-desk/indian-medical-register/", "_blank");
  };

  const load = async(k)=>{
    setError(null); setUnlocking(true);
    try{
      const res = await fetch(API+"/admin/pending-doctors",{headers:{"X-Admin-Key":k}});
      if(!res.ok){ setError("Wrong admin key, or server rejected the request."); return; }
      setPending(await res.json()); setUnlocked(true);
    } finally { setUnlocking(false); }
  };

  const approve = async(id)=>{
    setMsg(null); setApprovingId(id);
    try{
      const res = await fetch(API+`/admin/approve-doctor/${id}`,{method:"POST",headers:{"X-Admin-Key":key}});
      if(res.ok){ setMsg("Approved."); await load(key); }
    } finally { setApprovingId(null); }
  };

  if(!unlocked){
    return (
      <div className="auth-center">
        <div className="card authcard">
          <h2>Admin — verify doctors</h2>
          <div style={{position:"relative"}}>
            <input placeholder="Admin key" type={showKey?"text":"password"} value={key}
              onChange={e=>setKey(e.target.value)} style={{paddingRight:44}}/>
            <button type="button" onClick={()=>setShowKey(s=>!s)}
              aria-label={showKey?"Hide key":"Show key"}
              style={{position:"absolute",right:6,top:6,width:32,height:32,padding:0,
                background:"transparent",border:"none",cursor:"pointer",color:"var(--ink-faint)",
                display:"flex",alignItems:"center",justifyContent:"center"}}>
              {showKey ? (
                <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.7" strokeLinecap="round" strokeLinejoin="round">
                  <path d="M17.94 17.94A10.94 10.94 0 0112 20c-7 0-11-8-11-8a18.5 18.5 0 015.06-5.94M9.9 4.24A10.94 10.94 0 0112 4c7 0 11 8 11 8a18.5 18.5 0 01-2.16 3.19m-6.72-1.07a3 3 0 11-4.24-4.24"/>
                  <line x1="1" y1="1" x2="23" y2="23"/>
                </svg>
              ) : (
                <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.7" strokeLinecap="round" strokeLinejoin="round">
                  <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                  <circle cx="12" cy="12" r="3"/>
                </svg>
              )}
            </button>
          </div>
          <button className="primary" style={{width:"100%"}} onClick={()=>load(key)} disabled={unlocking}>
            {unlocking ? <span className="spin">↻</span> : "Unlock"}
          </button>
          {error && <div className="err fade-in" style={{marginTop:12}}>{error}</div>}
        </div>
      </div>
    );
  }

  return (
    <div style={{padding:"24px 0"}}>
      <div className="card" style={{padding:18}}>
        <div className="eyebrow">Pending doctor verifications</div>
        {pending.length===0 && <p style={{color:"var(--ink-faint)",fontSize:13}}>Nothing pending.</p>}
        {pending.map(d=>(
          <div key={d.doctor_id} className="fade-in" style={{background:"var(--panel2)",
            border:"1px solid var(--line)",borderRadius:10,padding:"14px 16px",marginBottom:10}}>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"baseline",marginBottom:8}}>
              <span style={{fontWeight:600}}>Dr. {d.full_name}</span>
              <span className="mono" style={{fontSize:11,color:"var(--ink-faint)"}}>{d.email}</span>
            </div>
            <div style={{fontSize:12.5,color:"var(--ink-dim)",marginBottom:4}}>
              License #: <span className="mono">{d.license_number || "not given"}</span></div>
            <div style={{fontSize:12.5,color:"var(--ink-dim)",marginBottom:12}}>
              Council: {d.medical_council || "not given"} · Specialty: {d.specialty}</div>
            <div style={{display:"flex",gap:8,flexWrap:"wrap"}}>
              <button className="ghost" onClick={()=>viewDocument(d.doctor_id)} disabled={!d.has_license_doc}>
                {d.has_license_doc ? "View license document" : "No document uploaded"}
              </button>
              <button className="ghost" onClick={openRegistry}>Open NMC registry ↗</button>
              <button className="primary" onClick={()=>approve(d.doctor_id)} disabled={approvingId===d.doctor_id}>
                {approvingId===d.doctor_id ? <span className="spin">↻</span> : "Approve"}
              </button>
            </div>
          </div>
        ))}
        {msg && <p style={{color:"var(--teal)",fontSize:13,marginTop:10}}>{msg}</p>}
      </div>
    </div>
  );
}

function App(){
  // useAuth called unconditionally (Rules of Hooks) even though the admin
  // page doesn't need it — branching happens only in the return below.
  const {token,role,name,isVerified,login,logout} = useAuth();
  const isAdminUrl = new URLSearchParams(location.search).get("admin")==="1";

  useEffect(()=>{
    if(isAdminUrl) document.title = "Admin Page";
    else if(!token) document.title = "DFU Clinical Platform";
    else if(role==="doctor") document.title = "Doctor Portal";
    else document.title = "Patient Portal";
  },[isAdminUrl,token,role]);

  if(isAdminUrl) return <div className="wrap"><AdminPanel/></div>;
  if(!token) return <div className="wrap"><AuthForm onAuth={login}/></div>;
  return role==="doctor"
    ? <DoctorView token={token} name={name} isVerified={isVerified} logout={logout}/>
    : <PatientView token={token} name={name} logout={logout}/>;
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
